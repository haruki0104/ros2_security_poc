name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (shell + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell 語法檢查 (bash -n)
        run: |
          fail=0
          for s in scripts/*.sh hardening/*.sh attacks/*.sh; do
            [ -f "$s" ] || continue
            if bash -n "$s"; then
              echo "✅ $s"
            else
              echo "❌ $s"; fail=1
            fi
          done
          exit $fail

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: 無法追蹤 source 的外部檔（ROS setup）→ 忽略
          shellcheck -e SC1091 scripts/*.sh hardening/*.sh || true

      - name: Python 語法檢查
        run: |
          python3 -m py_compile attacks/*.py victim/*.py monitor/*.py
          echo "✅ Python 語法通過"

  security:
    name: Secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 確認未提交私鑰 / keystore
        run: |
          if git ls-files | grep -E 'keystore/|\.key\.pem$|/key\.pem$'; then
            echo "❌ 偵測到 keystore 或私鑰被提交！"
            exit 1
          fi
          echo "✅ 無私鑰進入版控"
